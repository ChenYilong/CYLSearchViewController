org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
# The upstream samples use library resources through their own R class (built before non-transitive R classes).
android.nonTransitiveRClass=false
kotlin.code.style=official
# The CYLTabBarController commit the example depends on: the newest commit on any branch, found with
# CYLTabBarController/scripts/latest-cyl-commit.sh (AGENTS.md, "CYLTabBarController"). Refresh it before a build.
cyl.tabbar.commit=74aa25e55d169a15fe95a119ea1a377c5fc54217
# The CollectionViewClassifyMenu commit (newest on any branch: `git log --remotes -1` in that repository), for the tag
# suggestion style.
cyl.classifymenu.commit=f9724167235dee050a81432f3c16f6c4e15dc186
# The CYLTableViewPlaceHolder commit (newest on any branch), for the empty search results placeholder.
cyl.placeholder.commit=5e30638c09139e13da7c0763487537ac39c954e5
# AGP 9 builds Kotlin itself; these modules (and CYLTabBarController's) apply the Kotlin plugin and kapt, so built-in
# Kotlin is off here. The Flutter app that includes this build keeps its own setting (an included build has its own
# gradle.properties).
android.builtInKotlin=false
android.newDsl=false
