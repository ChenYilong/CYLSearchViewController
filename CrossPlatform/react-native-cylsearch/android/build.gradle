ext.Cylsearch = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return Cylsearch[prop]
}


apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}


apply plugin: "com.facebook.react"

android {
  namespace "com.cylsearch"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // The native core (CYLSearchViewController's Android port, with CollectionViewClassifyMenu and CYLTableViewPlaceHolder).
  // Inside this repository the example substitutes it with the android/merged composite build.
  api "com.cyl.search:cylsearch:0.1.0"
  implementation "androidx.appcompat:appcompat:1.7.0"
}
